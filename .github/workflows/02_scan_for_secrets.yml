name: Scan this repository for secrets

# Runs the shared Gitleaks scan of 01_scan_for_secrets.yml on this repository itself, which the
# shared file alone never does because it only answers workflow_call.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    uses: ./.github/workflows/01_scan_for_secrets.yml
